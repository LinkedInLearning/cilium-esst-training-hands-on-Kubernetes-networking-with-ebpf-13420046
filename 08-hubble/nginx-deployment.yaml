apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # Keep nginx off the client's node so pod-to-pod traffic crosses the
      # wire and shows the to-overlay trace point in Hubble.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: netshoot-client
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.31.5
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  # Hand out both an IPv4 and an IPv6 ClusterIP.
  ipFamilyPolicy: PreferDualStack
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
