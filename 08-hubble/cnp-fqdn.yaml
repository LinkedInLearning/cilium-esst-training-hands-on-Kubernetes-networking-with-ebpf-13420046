apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fqdn
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: client
  egress:
    # Allow DNS to kube-dns so the DNS proxy can resolve and enforce names.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Keep the in-cluster nginx path open so its flows still appear.
    - toEndpoints:
        - matchLabels:
            app: nginx
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Allow egress only to cilium.io; anything else is dropped.
    - toFQDNs:
        - matchName: "cilium.io"
